<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Залишити відгук</title>
    <!-- Підключаємо офіційний скрипт Telegram WebApp -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #191923);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin-bottom: 20px; font-size: 22px; text-align: center; }
        .rating-container { display: flex; gap: 10px; margin-bottom: 25px; }
        .fire-btn {
            font-size: 30px; cursor: pointer; opacity: 0.3; transition: transform 0.2s, opacity 0.2s;
        }
        .fire-btn.active { opacity: 1; transform: scale(1.2); }
        textarea {
            width: 100%; max-width: 350px; height: 120px;
            background-color: var(--tg-theme-secondary-bg-color, #242432);
            color: var(--tg-theme-text-color, #ffffff);
            border: 1px solid #3c3c50; border-radius: 12px;
            padding: 12px; font-size: 16px; resize: none; box-sizing: border-box;
        }
        textarea:focus { outline: none; border-color: #505078; }
        .submit-btn {
            margin-top: 25px; width: 100%; max-width: 350px; padding: 14px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>✍️ Ваш відгук</h2>
    
    <!-- Вибір вогників -->
    <div class="rating-container">
        <span class="fire-btn" onclick="setRating(1)">🔥</span>
        <span class="fire-btn" onclick="setRating(2)">🔥</span>
        <span class="fire-btn" onclick="setRating(3)">🔥</span>
        <span class="fire-btn" onclick="setRating(4)">🔥</span>
        <span class="fire-btn" onclick="setRating(5)">🔥</span>
    </div>

    <!-- Текстове поле -->
    <textarea id="feedback-text" placeholder="Напишіть кілька слів про вашу співпрацю..."></textarea>

    <!-- Кнопка відправки -->
    <button class="submit-btn" onclick="sendDataToBot()">Надіслати відгук</button>

    <script>
        // Ініціалізація Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Розгортаємо вікно на максимум

        let selectedRating = 0;

        function setRating(rating) {
            selectedRating = rating;
            const fires = document.querySelectorAll('.fire-btn');
            fires.forEach((fire, index) => {
                if (index < rating) {
                    fire.classList.add('active');
                } else {
                    fire.classList.remove('active');
                }
            });
        }

        function sendDataToBot() {
            const text = document.getElementById('feedback-text').value.trim();
            
            if (selectedRating === 0) {
                alert("Будь ласка, оберіть оцінку вогниками!");
                return;
            }
            if (!text) {
                alert("Будь ласка, напишіть текст відгуку!");
                return;
            }

            // Формуємо об'єкт із даними
            const data = {
                rating: selectedRating,
                text: text
            };

            // Надсилаємо дані назад у бот у форматі JSON
            tg.sendData(JSON.stringify(data));
            tg.close(); // Закриваємо WebApp форму
        }
    </script>
</body>
</html>
